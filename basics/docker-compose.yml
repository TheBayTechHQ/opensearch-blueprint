# The smallest OpenSearch you can run: one node, on this machine only.
# The security plugin is off so the examples stay short. Never do that on a network.
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch-basics
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
